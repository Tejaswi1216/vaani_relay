- id: q20
  question: "Which external human-annotated boundary dataset or handcrafted segmentation heuristics are used to supervise H-Net's dynamic chunking mechanism?"
  type: trap
  answerable: true
  gold_answer: "None. H-Net learns its content-dependent and context-dependent chunk boundaries jointly with the rest of the model through end-to-end training, without external boundary supervision or handcrafted heuristics."
  gold_location: {paper: dynchunk_v2, page: 1}
